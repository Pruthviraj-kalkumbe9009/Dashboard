<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Smart Classroom</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
<div class="login-card">
  <div class="brand brand-center"><div class="brand-icon">SC</div><div><h1>Smart Classroom</h1><p>Timetable Scheduler</p></div></div>
  <form id="loginForm">
    <label>Email / Username</label>
    <input id="username" required placeholder="Enter username">
    <label>Password</label>
    <input id="password" type="password" required placeholder="Enter password">
    <label>Role</label>
    <select id="role"><option value="admin">Admin</option><option value="faculty">Faculty</option><option value="student">Student</option></select>
    <button class="btn primary full" type="submit">Login</button>
  </form>
  <p class="demo-hint">Demo: any username/password works. Choose a role to preview its dashboard.</p>
</div>
<script src="js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', e=>{
 e.preventDefault();
 localStorage.setItem('sc_user', JSON.stringify({name:document.getElementById('username').value,role:document.getElementById('role').value}));
 location.href='dashboard.html';
});
</script>
</body>
</html>
